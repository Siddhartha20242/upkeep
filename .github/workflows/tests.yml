name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,sign]" coverage mypy
      - name: Type check
        run: mypy upkeep --ignore-missing-imports
      - name: Tests (no network, no Docker, no model keys needed)
        run: |
          coverage run --source=upkeep -m pytest -q
          coverage report --fail-under=85
