# Example GitHub Actions workflow: when a requirements file changes (and once a week), list the lines of YOUR code that a
# dependency upgrade would break. Copy it to .github/workflows/upkeep-audit.yml.
# It reads exact pins (name==version) from requirements*.txt, so it only needs the repo. No API key and no Docker.
# This example file itself has not been run on GitHub Actions; the command it runs has (see tests and docs/EVIDENCE.md).
name: upkeep-audit
on:
  pull_request:
    paths: ["requirements*.txt"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # read-only: it never pushes and never comments unless you add a step for that
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install git+https://github.com/Siddhartha20242/upkeep.git
      - name: Which pinned dependencies would break this code if upgraded?
        # --fail-on hard: fail the build only for lines that will fail (removed names, removed or new required parameters).
        # Changed defaults are listed for review. Exit code 3 (nothing could be analysed) always fails.
        run: upkeep audit --repo . --fail-on hard
